# ============================================================================
# LongBench -- FullKV baseline (Mistral-7B-Instruct-v0.2)
#
# transformers DynamicCache: no eviction, no quantization.
#   python main.py --config configs/mistral/longbench_full_cache.yaml
# Score with:  scripts/score_longbench.sh <output_dir>
# ============================================================================
_base_: ../base.yaml

run:
  mode: longbench
  seed: 42

model:
  name: mistralai/Mistral-7B-Instruct-v0.2
  revision: main
  dtype: float16
  attn_implementation: flash_attention_2

cache:
  backend: dynamic                      # FullKV
  backend_package: null
  cache_budget: null

telemetry:
  track_scores: false

longbench:
  datasets:                             # the 16 English LongBench datasets
    - narrativeqa
    - qasper
    - multifieldqa_en
    - hotpotqa
    - 2wikimqa
    - musique
    - gov_report
    - qmsum
    - multi_news
    - trec
    - triviaqa
    - samsum
    - passage_count
    - passage_retrieval_en
    - lcc
    - repobench-p
  include_chinese: false
  use_e_variants: false                 # LongBench-E length-stratified variants
  max_length: 31500                        # Mistral-7B-Instruct-v0.2: 32K context, published LongBench truncation
  output_dir: outputs/longbench/mistral_full_cache
  seed: 42
  resume: false
  skip_oom: true                        # record OOM'd examples as pred=null
  aggressive_cache_clear: false
